# ONE TENANT of the deployment. Run it once per tenant, with a different
# CLTL_TENANT and a different CLTL_CHATUI_PORT each time:
#
#   CLTL_TENANT=tenant-a CLTL_CHATUI_PORT=8000 \
#       docker compose -f deployment/tenant.compose.yml up -d
#   CLTL_TENANT=tenant-b CLTL_CHATUI_PORT=8001 \
#       docker compose -f deployment/tenant.compose.yml up -d
#
# Bring deployment/server.compose.yml up FIRST — this half joins the network
# that one creates, and compose refuses to start otherwise ("network
# cltl-example declared as external, but could not be found"). Tear this half
# down BEFORE the server, for the same reason.
#
# What makes this a tenant is CLTL_TENANT and nothing else. The configuration
# under ./config/tenant is byte-identical for every tenant; the tenant id
# arrives from the environment and is interpolated when the value is read.
#
# The chat UI lives HERE rather than on the server because it publishes
# utterances without source=, so an untenanted one would route to the bare
# `cltl.topic.text_in` key, which no tenanted subscriber binds.
#
# cltl-monitoring would live here too, for a plainer reason: it SUBSCRIBES. It
# keys its state by scenario id, so one shared instance would aggregate every
# tenant's conversation behind a single URL. The rule this deployment follows is
# "anything that reads the bus is tenanted" — which is also why `storage`, on
# the server, is not. See docs/tenancy.md.
#
# It is behind a PROFILE and off by default, and the reason is not taste:
# `ghcr.io/leolani/cltl-monitoring` is not a published package. Every other
# image this deployment uses pulls anonymously; that one answers
# `unauthorized` for `:latest` and for a version tag alike, while
# cltl-emissor-data pulled from the same registry in the same minute. So the
# default `up` must not ask for it. To turn it on, once the image exists (or
# once you have built it yourself and tagged it):
#
#   CLTL_TENANT=tenant-a CLTL_CHATUI_PORT=8000 \
#       CLTL_MONITORING_PORT=8010 \
#       CLTL_MONITORING_URL=http://127.0.0.1:8010/monitoring \
#       docker compose --profile monitoring -f deployment/tenant.compose.yml up -d
#
# Two variables rather than one because they are read by two different things:
# the port is published here, and the URL is what a BROWSER is told to fetch.
# CLTL_MONITORING_URL empty — the default — leaves the tab out of the page
# altogether, which is better than a tab whose iframe cannot load.
#
# The chat UI stays BLANK until something opens this tenant's scenario. Nothing
# in this file does: there is no cltl-context anywhere in this deployment. That
# job belongs to the custom side — the notebook (rung 1), attach/listen.py
# (rung 2), or the module's own container (rung 4, compose/example.compose.yml).
# See docs/tenancy.md.
#
# `name:` interpolates CLTL_TENANT and REQUIRES it: with the variable unset,
# compose fails at interpolation before starting anything, rather than letting
# the repo's most-documented failure mode — an unexpanded $CLTL_TENANT reaching
# the bus as a literal string — happen quietly. `-p` still overrides it if you
# need a different project name.

name: cltl-example-tenant-${CLTL_TENANT:?set CLTL_TENANT to this tenant's id, e.g. tenant-a}

services:
  chatui:
    image: ghcr.io/leolani/cltl-chat-ui:${CLTL_IMAGE_TAG:-latest}
    restart: "no"
    ports:
      # Required, not defaulted: two tenants on one host must publish on
      # different ports, and being told to pick one is better than discovering
      # "port is already allocated" on the second `up`.
      - "${CLTL_CHATUI_PORT:?set a distinct host port per tenant, e.g. 8000 for tenant-a and 8001 for tenant-b}:8000"
    volumes:
      - ./config/tenant:/cltl-chatui/config:ro
    environment:
      CLTL_AMQP_URL: amqp://leolani:leolani@rabbitmq:5672/
      # What makes this stack a tenant. Assigned, never defaulted — see `name:`.
      CLTL_TENANT: "${CLTL_TENANT:?set CLTL_TENANT to this tenant's id, e.g. tenant-a}"
      # Where the chat UI PUTs the pixels of an uploaded image, so that the
      # `cltl-storage:image/<id>` reference it publishes resolves for everyone
      # else — this module included. Container-side view; the trailing slash is
      # load-bearing (urljoin). One variable for chat-ui, monitoring and the
      # rung-4 module, so the three cannot drift apart.
      CLTL_STORAGE_URL: ${CLTL_STORAGE_URL:-http://storage:8000/storage/}
      # The URL the BROWSER uses to reach this tenant's monitoring page, which
      # the chat UI puts in an iframe. 127.0.0.1 and the PUBLISHED port,
      # therefore — never `monitoring:8000`, which resolves on the compose
      # network and nowhere a browser can see. chat.js appends
      # /static/monitoring.html?scenario=<id> to it.
      #
      # Empty by default, which leaves the Monitoring tab out of the page —
      # see the header: the monitoring image is not published, so the service
      # behind this URL is opt-in.
      CLTL_MONITORING_URL: ${CLTL_MONITORING_URL:-}
      CLTL_LOGGING_CONFIG: /cltl-chatui/config/logging.config
    networks:
      - cltl

  monitoring:
    # Opt-in: `docker compose --profile monitoring up -d`. See the header for
    # why, and for the two variables to set with it. A profiled-out service is
    # still INTERPOLATED, which is why nothing in this file uses `:?` for the
    # monitoring variables — a required variable would fail the default `up`
    # too, for a service that default `up` does not start.
    profiles: ["monitoring"]
    image: ghcr.io/leolani/cltl-monitoring:${CLTL_IMAGE_TAG:-latest}
    restart: "no"
    ports:
      - "${CLTL_MONITORING_PORT:-8010}:8000"
    volumes:
      - ./config/tenant:/cltl-monitoring/config:ro
    environment:
      CLTL_AMQP_URL: amqp://leolani:leolani@rabbitmq:5672/
      CLTL_TENANT: "${CLTL_TENANT:?set CLTL_TENANT to this tenant's id, e.g. tenant-a}"
      # Monitoring only READS from storage: it resolves the same
      # `cltl-storage:image/<id>` reference the chat UI published, with the same
      # client this template's own module uses (ClientImageSource).
      CLTL_STORAGE_URL: ${CLTL_STORAGE_URL:-http://storage:8000/storage/}
      CLTL_LOGGING_CONFIG: /cltl-monitoring/config/logging.config
    networks:
      - cltl

networks:
  cltl:
    # Created by deployment/server.compose.yml. Joining it rather than creating
    # a second one is what makes `rabbitmq` resolve as a hostname here without
    # any host.docker.internal indirection — and what makes it obvious that the
    # tenants are NOT separated by the network.
    name: cltl-example
    external: true
