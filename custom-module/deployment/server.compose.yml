# The SHARED, UNTENANTED half of a multi-tenant Leolani deployment: the broker
# every tenant talks through, and one cltl-eliza that serves all of them.
# Nothing is built here — the images come from ghcr.io/leolani and are public.
#
#   docker compose -f deployment/server.compose.yml up -d
#
# Then bring up one or more tenants — see deployment/tenant.compose.yml. There
# is no chat UI on this half: the chat UI runs INSIDE a tenant, because it
# publishes utterances without source= and an untenanted one would route to a
# bare topic key that no tenanted subscriber binds.
#
# `storage` IS on this half, and it is the exception that proves the rule: it
# subscribes to no topic at all, so it has no tenant dimension to get wrong.
# The rule is "anything that reads the bus is tenanted" — storage does not, any
# more than rabbitmq does. What follows from that is worth knowing: two tenants'
# pixels sit in one store, separated only by the opaque uuid each image is filed
# under. See docs/tenancy.md.
#
# `name:` pins the compose project so tearing this half down does not depend on
# which directory it was run from. The network is given an explicit `name:` as
# well, so that the tenants and rung-4 modules that join it as an EXTERNAL
# network have a stable address to name — see docs/tenancy.md.
#
# One network for the whole deployment, deliberately. Nothing here is separated
# by the network; the tenants are separated by a ROUTING KEY. Putting them on
# separate networks would invite the reader to conclude the isolation comes
# from Docker, and it does not. The platform's own harness does use separate
# networks plus host.docker.internal:host-gateway
# (cltl-dev/integration/src/cltl_integration/runner/tenants.py) — that is the
# right shape when tenants run on different hosts or the broker port is
# ephemeral, and the wrong shape for a template whose job is to show what the
# isolation actually rests on.
#
# Tear down LAST, after every tenant: this half owns the network, and `down`
# with tenant containers still attached leaves it undeletable.

name: cltl-example-server

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: leolani
      RABBITMQ_DEFAULT_PASS: leolani
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      # Published so that rungs 1-2 can reach the broker from outside the
      # compose network. Fixed host ports, unlike the integration harness's
      # ephemeral ones: this deployment is meant to be talked to by a human
      # following a document, and a port that changes every run cannot be
      # written down. The cost is that a second copy of this stack collides.
      - "${CLTL_AMQP_PORT:-5672}:5672"
      - "${CLTL_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      - cltl

  storage:
    image: ghcr.io/leolani/cltl-backend:${CLTL_IMAGE_TAG:-latest}
    # src/storage_main.py, NOT src/main.py. The default entry point is
    # BackendContainer — microphone, camera and text-to-speech in one process,
    # none of which exists here. src/storage_main.py is StorageContainer alone:
    # the /storage HTTP endpoint and nothing else. It is also the only entry
    # point that is safe on a SHARED bus: BackendContainer constructs
    # EventLogService, which subscribes to `event_bus.topics` — and
    # KombuEventBus.topics unions the topics it consumes with the
    # tenant-suffixed routing keys it has produced on, so on this half it would
    # subscribe to `cltl.topic.text_out.tenant-a` as though that were a topic
    # name. cltl-dev/integration/config/topologies/multitenant_server.config
    # records the same reasoning for leaving cltl-backend out altogether.
    command: ["python", "src/storage_main.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    ports:
      # 8002, not 8001: docs/deployment.md hands 8000 and 8001 to the two
      # tenants' chat UIs. Published because rungs 1-2 run OUTSIDE this network
      # and have to fetch pixels the same way a container does.
      - "${CLTL_STORAGE_PORT:-8002}:8000"
    volumes:
      - ./config/server:/cltl-backend/config:ro
      # Read-write, and the one bind mount in this deployment that is: this is
      # where the pixels actually land. ./storage/image and ./storage/audio are
      # committed (with .gitkeep) because CachedImageStorage does NOT create
      # them — see the .gitkeep files.
      - ./storage:/cltl-backend/storage
    environment:
      CLTL_AMQP_URL: amqp://leolani:leolani@rabbitmq:5672/
      # Empty for the same reason eliza's is, even though StorageService never
      # touches the bus: InfraContainer builds one anyway from
      # [cltl.event.kombu] tenant: $CLTL_TENANT, and an UNDEFINED variable would
      # arrive as the literal string "$CLTL_TENANT". An idle connection is
      # harmless; a queue nobody routes to is confusing. The platform's own
      # client/server-split server runs this same entry point the same way.
      CLTL_TENANT: ""
      CLTL_LOGGING_CONFIG: /cltl-backend/config/logging.config
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      - cltl

  eliza:
    image: ghcr.io/leolani/cltl-eliza:${CLTL_IMAGE_TAG:-latest}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./config/server:/cltl-eliza/config:ro
    environment:
      # The container-side view of the network: `rabbitmq` is a service name
      # here. A process OUTSIDE this network (rungs 1-2 — the notebook and
      # listen.py) uses 127.0.0.1 and the published port instead. Both reach
      # the same broker.
      CLTL_AMQP_URL: amqp://leolani:leolani@rabbitmq:5672/
      # EMPTY, and declared rather than defaulted. This half is untenanted: it
      # binds `<topic>.#` and serves every tenant. An UNDEFINED variable would
      # be passed through as the literal string "$CLTL_TENANT" with only a
      # warning, and KombuEventBus would bind `cltl.topic.text_in.$CLTL_TENANT`
      # — a real, valid, permanently empty queue. See docs/tenancy.md.
      CLTL_TENANT: ""
      CLTL_LOGGING_CONFIG: /cltl-eliza/config/logging.config
    networks:
      - cltl

networks:
  cltl:
    name: cltl-example
    driver: bridge
