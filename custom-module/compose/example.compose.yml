# One service, joined to ONE TENANT of a Leolani deployment that is ALREADY
# RUNNING.
#
# This is not a copy of integration/compose/docker-compose.yml and must not
# become one — that file IS a deployment; this file attaches to one, which is
# what a third-party module actually does. See docs/docker.md.
#
# Usage against the deployment in deployment/, started with:
#
#   docker compose -f deployment/server.compose.yml up -d
#   CLTL_TENANT=tenant-a CLTL_CHATUI_PORT=8000 \
#       docker compose -f deployment/tenant.compose.yml up -d
#
# then:
#
#   export CLTL_DEMO_CONFIG=$PWD/deployment/config/tenant
#   CLTL_TENANT=tenant-a docker compose -f compose/example.compose.yml up
#
# Run it once per tenant — the project name interpolates CLTL_TENANT, so
# tenant-a's module and tenant-b's module coexist. The NETWORK you join is the
# server's and is the same for every tenant; what makes this container tenant-a
# is CLTL_TENANT and nothing else. That is worth sitting with: the isolation is
# a routing key, not a network boundary. See docs/tenancy.md.
#
# Against the integration harness's demo stacks instead, the network name is
# randomised and the broker credentials are eliza/eliza123:
#
#   export CLTL_SERVER_NETWORK=$(docker network ls --format '{{.Name}}' | grep '^cltl-it-.*_cltl$')
#
# See docs/docker.md for both, including which file the volume below mounts.

name: cltl-example-module-${CLTL_TENANT:?set CLTL_TENANT to the tenant this module serves, e.g. tenant-a}

services:
  example:
    image: ghcr.io/myorg/cltl-example:${CLTL_IMAGE_TAG:-latest}
    environment:
      # Container-side view: `rabbitmq` is a service name on the deployment's
      # own compose network, not the 127.0.0.1:<published-port> URL a process
      # outside that network uses (see attach/connect.py for that one).
      CLTL_AMQP_URL: ${CLTL_AMQP_URL:-amqp://leolani:leolani@rabbitmq:5672/}
      # $VAR interpolation happens at config READ time. Every variable the
      # deployment's custom.config might interpolate has to be defined here,
      # even empty — an unset one is passed through as the literal string and
      # only warned about, never failed on. Same list, same reason, as
      # x-cltl-env in integration/compose/docker-compose.yml.
      CLTL_STORAGE_URL: ""
      CLTL_AUDIO_URL: ""
      CLTL_TTS_URL: ""
      # REQUIRED, not defaulted like the three above. This module opens its
      # tenant's scenario, and an untenanted publish lands on a bare routing
      # key that no tenanted chat UI binds — so an empty value here would leave
      # that tenant's chat UI blank forever with nothing logged. myorg.tenant
      # refuses to start on an empty or unexpanded value; compose refuses even
      # earlier, at interpolation.
      CLTL_TENANT: "${CLTL_TENANT:?set CLTL_TENANT to the tenant this module serves, e.g. tenant-a}"
    volumes:
      # One FILE, not the directory every platform module mounts over its own
      # config/. The deployment's config carries [cltl.event] implementation:
      # kombu and the broker address — every module in that deployment shares
      # it — but it has no [myorg.example] or [myorg.tenant] section, because
      # the deployment does not know about this template. This image's own
      # config/default.config supplies both (see the Dockerfile), so only the
      # connection overlay needs to come from outside, and it lands on
      # custom.config because the loader reads that as an overlay ON TOP of
      # default.config.
      #
      # Source is deployment/config/tenant/default.config: the TENANT half, not
      # the server half — it is the one that carries `tenant: $CLTL_TENANT`.
      # A deployment that instead generates a custom.config (as the platform's
      # own test harness does) needs that name here instead. See docs/docker.md.
      - ${CLTL_DEMO_CONFIG:?set to the running deployment's tenant config directory, e.g. $PWD/deployment/config/tenant}/default.config:/cltl-example/config/custom.config:ro
    networks:
      - server
    restart: "no"

networks:
  server:
    # The SERVER's network, created by deployment/server.compose.yml and shared
    # by every tenant. Joining it is how this container reaches the broker; it
    # is not what scopes it to a tenant.
    name: ${CLTL_SERVER_NETWORK:-cltl-example}
    external: true
