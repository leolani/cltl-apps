# One service, joined to ONE TENANT of a Leolani deployment that is ALREADY
# RUNNING.
#
# Written against a cltl-apps checkout: bring up the root servers/broker (and
# whichever servers/* stacks the deployment needs) and one tenant's
# clients/context first, then this container joins the SAME network as any
# other tenant-scoped service:
#
#   docker compose -f ../../servers/broker/docker-compose.yml \
#                   -f ../../servers/eliza/docker-compose.yml up -d --wait
#   CLTL_TENANT=tenant-a docker compose -f ../../clients/context/docker-compose.yml up -d --wait
#
#   export CLTL_DEMO_CONFIG=$PWD/../../clients/context/config
#   CLTL_TENANT=tenant-a docker compose -f compose/example.compose.yml up
#
# Run it once per tenant — the project name interpolates CLTL_TENANT, so
# tenant-a's module and tenant-b's module coexist. The NETWORK you join
# (`cltl-platform`, created by servers/broker) is the platform's and is the
# same for every tenant; what makes this container tenant-a is CLTL_TENANT
# and nothing else. The isolation is a routing key, not a network boundary —
# see ../../doc/DEPLOYMENT.md#tenancy.
#
# Against a different deployment entirely, point CLTL_SERVER_NETWORK,
# CLTL_AMQP_URL and CLTL_STORAGE_URL at its own broker/network/storage
# instead — nothing below is cltl-apps-specific except the defaults.

name: cltl-example-module-${CLTL_TENANT:?set CLTL_TENANT to the tenant this module serves, e.g. tenant-a}

services:
  example:
    image: ghcr.io/myorg/cltl-example:${CLTL_IMAGE_TAG:-latest}
    environment:
      # Container-side view: `rabbitmq` is a service name on the deployment's
      # own compose network, not the 127.0.0.1:<published-port> URL a process
      # outside that network uses.
      CLTL_AMQP_URL: ${CLTL_AMQP_URL:-amqp://eliza:eliza123@rabbitmq:5672/}
      # Where `cltl-storage:image/<id>` resolves. REAL, not a placeholder: this
      # module fetches the pixels of every image signal it sees, and
      # [myorg.example] image_storage_url refuses an empty or unexpanded value.
      # Container-side view of servers/eliza's storage service, and the
      # trailing slash is load-bearing — the reference is resolved with
      # urljoin(), which drops the last path segment of a base without one.
      CLTL_STORAGE_URL: ${CLTL_STORAGE_URL:-http://eliza-backend:8000/storage/}
      # $VAR interpolation happens at config READ time. Every variable the
      # mounted custom.config might interpolate has to be defined here, even
      # empty — an unset one is passed through as the literal string and only
      # warned about, never failed on.
      CLTL_AUDIO_URL: ""
      CLTL_TTS_URL: ""
      # This is the whole demonstration: an empty value here makes the module
      # answer every tenant; setting it scopes it to exactly one.
      CLTL_TENANT: "${CLTL_TENANT:?set CLTL_TENANT to the tenant this module serves, e.g. tenant-a}"
    volumes:
      # One FILE, not the directory every platform module mounts over its own
      # config/. The deployment's config carries [cltl.event] implementation:
      # kombu and the broker address — every service in that deployment shares
      # it — but it has no [myorg.example] section, because the deployment
      # does not know about this template. This image's own config/default.config
      # supplies it (see the Dockerfile), so only the connection overlay needs
      # to come from outside, and it lands on custom.config because the loader
      # reads that as an overlay ON TOP of default.config.
      #
      # Source is a clients/*/config directory: any of them carries the
      # [cltl.event.kombu] tenant: $CLTL_TENANT line this module also needs —
      # see clients/context/config/custom.config for the canonical one.
      - ${CLTL_DEMO_CONFIG:?set to a running clients/* stack's config directory, e.g. ../../clients/chat-ui/config}/custom.config:/cltl-example/config/custom.config:ro
    networks:
      - server
    restart: "no"

networks:
  server:
    # The platform's network, created by servers/broker and shared by every
    # tenant and every servers/* stack. Joining it is how this container
    # reaches the broker; it is not what scopes it to a tenant.
    name: ${CLTL_SERVER_NETWORK:-cltl-platform}
    external: true
