# One service, joined to a Leolani deployment that is ALREADY RUNNING.
#
# This is not a copy of integration/compose/docker-compose.yml and must not
# become one — that file IS a deployment; this file attaches to one, which is
# what a third-party module actually does. See docs/docker.md.
#
# Usage against the deployment in deployment/deployment.compose.yml, started
# with `docker compose -f deployment/deployment.compose.yml up -d`:
#
#   export CLTL_DEMO_CONFIG=$PWD/deployment/config
#   export CLTL_DEMO_NETWORK=cltl-example-deployment_cltl
#   docker compose -f compose/example.compose.yml -p cltl-example-module up
#
# Against the integration harness's demo stacks instead, the network name is
# randomised and the broker credentials are eliza/eliza123:
#
#   export CLTL_DEMO_NETWORK=$(docker network ls --format '{{.Name}}' | grep '^cltl-it-.*_cltl$')
#
# See docs/docker.md for both, including which file the volume below mounts.

services:
  example:
    image: ghcr.io/myorg/cltl-example:${CLTL_IMAGE_TAG:-latest}
    environment:
      # Container-side view: `rabbitmq` is a service name on the deployment's
      # own compose network, not the 127.0.0.1:<published-port> URL a process
      # outside that network uses (see attach/connect.py for that one).
      CLTL_AMQP_URL: ${CLTL_AMQP_URL:-amqp://leolani:leolani@rabbitmq:5672/}
      # $VAR interpolation happens at config READ time. Every variable the
      # deployment's custom.config might interpolate has to be defined here,
      # even empty — an unset one is passed through as the literal string and
      # only warned about, never failed on. Same list, same reason, as
      # x-cltl-env in integration/compose/docker-compose.yml.
      CLTL_STORAGE_URL: ""
      CLTL_AUDIO_URL: ""
      CLTL_TTS_URL: ""
      CLTL_TENANT: "${CLTL_TENANT:-}"
    volumes:
      # One FILE, not the directory every platform module mounts over its own
      # config/. The deployment's config carries [cltl.event] implementation:
      # kombu and the broker address — every module in that deployment shares
      # it — but it has no [myorg.example] section, because the deployment does
      # not know about this template. This image's own config/default.config
      # supplies that section (see the Dockerfile), so only the connection
      # overlay needs to come from outside, and it lands on custom.config
      # because the loader reads that as an overlay ON TOP of default.config.
      #
      # Source is default.config: that is the filename the deployment in
      # deployment/config/ actually uses. A deployment that instead generates a
      # custom.config (as the platform's own test harness does) needs that name
      # here instead. See docs/docker.md.
      - ${CLTL_DEMO_CONFIG:?set to the running deployment's config directory}/default.config:/cltl-example/config/custom.config:ro
    networks:
      - deployment
    restart: "no"

networks:
  deployment:
    name: ${CLTL_DEMO_NETWORK:?set to the deployment's network — see `docker network ls`}
    external: true
