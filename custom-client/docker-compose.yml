services:
  eliza-backend:
    image: ghcr.io/leolani/cltl-backend:${VERSION:-latest}
    container_name: eliza-client-backend
    ports:
      - "9001:8000"
    volumes:
      - ./config:/cltl-backend/config
      - ./storage:/cltl-backend/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-backend/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - eliza-client-network

  uai-client-context:
    image: ghcr.io/leolani/cltl-context:${VERSION:-latest}
    container_name: uai-client-context
    volumes:
      - ./config:/cltl-context/config
      - ./storage:/cltl-context/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-context/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      uai-client-backend:
        condition: service_healthy
    networks:
      - uai-client-network

  uai-client-chatui:
    image: ghcr.io/leolani/cltl-chat-ui:${VERSION:-latest}
    container_name: uai-client-chatui
    ports:
      - "8003:8000"
    volumes:
      - ./config:/cltl-chatui/config
      - ./storage:/cltl-chatui/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-chatui/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      uai-client-backend:
        condition: service_healthy
    networks:
      - uai-client-network

networks:
  uai-client-network:
    driver: bridge
