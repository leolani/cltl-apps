# The ELIZA dialogue engine: consumes text_in and publishes text_out.
#
# Untenanted, and deliberately so: with no tenant configured it binds
# `cltl.topic.text_in.#` and answers every tenant on the platform. Giving it
# a tenant would scope it to one tenant's traffic — see
# ../../doc/DEPLOYMENT.md#tenancy.
#
# Needs modules/broker in the same invocation (the depends_on below only
# resolves for a service defined in the same merged project):
#
#   docker compose -f ../broker/docker-compose.yml -f docker-compose.yml up -d --wait --pull always
#
# The storage service that used to live in this file as `eliza-backend` is
# now modules/backend. It was always the same cltl-backend image; whether it
# serves storage itself or forwards to a remote one is configuration, not a
# different module.

name: ${CLTL_PROJECT:-cltl-platform}

services:
  eliza-eliza:
    image: ghcr.io/leolani/cltl-eliza:${VERSION:-latest}
    volumes:
      - ../../config/default.config:/cltl-eliza/config/default.config:ro
      - ../../config/custom.config:/cltl-eliza/config/custom.config:ro
      - ../../config/logging.config:/cltl-eliza/config/logging.config:ro
      - ../../storage:/cltl-eliza/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-eliza/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cltl-platform

networks:
  cltl-platform:
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
