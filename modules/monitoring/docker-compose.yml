# The monitoring view: a per-scenario page (image, transcript, detected
# faces) that modules/chat-ui's Monitoring tab can embed.
#
# Optional and independent — no depends_on of its own; it only needs the
# event bus reachable at [cltl.event.kombu] server, like every other module.
#
#   docker compose --env-file ../../config/<role>.env -f docker-compose.yml up -d --wait --pull always
#
# To show it in modules/chat-ui's Monitoring tab, set [cltl.chat-ui]
# monitoring_url in config/custom.config to a bare, browser-reachable origin
# matching CLTL_MONITORING_PORT below (the chat UI frontend appends
# /static/monitoring.html itself), and add this file's `-f` alongside
# chat-ui's. Left empty, the tab is simply not shown — which is safer than a
# tab whose iframe cannot load.

name: ${CLTL_PROJECT:-cltl-platform}

services:
  monitoring:
    image: ghcr.io/leolani/cltl-monitoring:${VERSION:-latest}
    restart: "no"
    ports:
      - "${CLTL_MONITORING_PORT:-8005}:8000"
    volumes:
      - ../../config/default.config:/cltl-monitoring/config/default.config:ro
      - ../../config/custom.config:/cltl-monitoring/config/custom.config:ro
      - ../../config/logging.config:/cltl-monitoring/config/logging.config:ro
      - ../../storage:/cltl-monitoring/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-monitoring/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cltl-platform

networks:
  cltl-platform:
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
