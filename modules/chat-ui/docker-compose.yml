# The web chat UI: the browser-facing text input and output channel, and the
# sole input channel in a text-only deployment.
#
# Its Monitoring tab is an iframe onto modules/monitoring, shown only when
# [cltl.chat-ui] monitoring_url is set in config/custom.config.
#
# Needs modules/backend up and healthy (see depends_on below — bring both up
# in one invocation, or have backend already running):
#
#   docker compose --env-file ../../config/<role>.env \
#       -f ../backend/docker-compose.yml -f docker-compose.yml up -d --wait --pull always

name: ${CLTL_PROJECT:-cltl-platform}

services:
  chatui:
    image: ghcr.io/leolani/cltl-chat-ui:${VERSION:-latest}
    restart: "no"
    ports:
      - "${CLTL_CHATUI_PORT:-8003}:8000"
    volumes:
      - ../../config/default.config:/cltl-chatui/config/default.config:ro
      - ../../config/custom.config:/cltl-chatui/config/custom.config:ro
      - ../../config/logging.config:/cltl-chatui/config/logging.config:ro
      - ../../storage:/cltl-chatui/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-chatui/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cltl-platform

networks:
  cltl-platform:
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
