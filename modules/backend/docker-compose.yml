# The platform's backend. One cltl-backend image running two facets in one
# container (BackendContainer extends StorageContainer):
#
#   - storage — the /storage HTTP API, always mounted. With [cltl.backend]
#     audio_storage/image_storage = local it holds the store itself; with
#     `remote` it forwards to another backend's storage_url.
#   - hardware I/O — microphone, camera and text-to-speech, proxied from the
#     host's microphone/camera server (leoserv; see run_host_server.sh, which
#     cannot run in Docker because a container has no microphone). Each is
#     switched off by leaving its topic empty in config.
#
# Which facets are live is purely configuration, which is why there is one
# backend module and not a separate one per deployment role:
#
#   standalone   both — holds the store AND proxies this machine's leoserv
#   server       storage only — mic/image/tts topics left empty
#   tenant       hardware I/O, forwarding storage to the server's backend
#
# See ../../templates/ for those three configurations, and
# ../../doc/DEPLOYMENT.md for which modules each deployment runs.
#
# Deliberately declares no `depends_on: rabbitmq`: a tenant deployment runs
# this module with no local event bus, and a depends_on naming a service absent
# from the invocation makes Compose refuse to start at all.
#
#   ./run_host_server.sh &   # leoserv, on the host — skip for text-only
#   docker compose --env-file ../../config/<role>.env -f docker-compose.yml up -d --wait --pull always

name: ${CLTL_PROJECT:-cltl-platform}

services:
  backend:
    image: ghcr.io/leolani/cltl-backend:${VERSION:-latest}
    restart: "no"
    ports:
      # The /storage API (plus /host, when [cltl.backend] run_server is set).
      # Host bind address defaults to every interface; set
      # CLTL_STORAGE_BIND=127.0.0.1 in this checkout's env file when
      # modules/reverse-proxy fronts it, so the raw port is no longer
      # reachable from outside this host.
      - "${CLTL_STORAGE_BIND:-0.0.0.0}:${CLTL_BACKEND_PORT:-8001}:8000"
    volumes:
      - ../../config/default.config:/cltl-backend/config/default.config:ro
      - ../../config/custom.config:/cltl-backend/config/custom.config:ro
      - ../../config/logging.config:/cltl-backend/config/logging.config:ro
      - ../../storage:/cltl-backend/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-backend/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - cltl-platform

networks:
  cltl-platform:
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
