# The platform's message broker: RabbitMQ, plus the Docker network that every
# module in THIS deployment shares. Start it first — modules/eliza,
# modules/vad-asr, modules/emissor and modules/reverse-proxy each declare
# `depends_on: rabbitmq: condition: service_healthy`, which Compose can only
# resolve for a service defined in the same merged project:
#
#   docker compose -f modules/broker/docker-compose.yml up -d --wait --pull always
#
# A client deployment does NOT run this module: it reaches the server's
# broker over AMQP, set as [cltl.event.kombu] server in config/custom.config.
# A server or standalone deployment runs exactly one of it.
#
# `name:` interpolates identically in every modules/* compose file, so
# bringing several up in one `-f ... -f ...` invocation merges them into a
# single Compose project — which is what lets `depends_on` resolve across
# files. See ../../doc/DEPLOYMENT.md.

name: ${CLTL_PROJECT:-cltl-platform}

services:
  rabbitmq:
    image: "rabbitmq:3.12-management"
    # Load-bearing: RabbitMQ derives its node name and mnesia directory
    # (storage/rabbitmq/mnesia/rabbit@rabbitmq) from this. Changing it
    # orphans an existing broker's data.
    hostname: rabbitmq
    ports:
      # AMQP. Published on every interface so a client deployment on another
      # machine can reach it, and unaffected by modules/reverse-proxy: no
      # HTTP proxy can add TLS or auth to AMQP (its auth is in-protocol SASL).
      - "5672:5672"
      # Management UI. Host bind address defaults to every interface; set
      # CLTL_RABBITMQ_MGMT_BIND=127.0.0.1 in this checkout's env file when
      # modules/reverse-proxy fronts it, so the raw port is no longer
      # reachable from outside this host.
      - "${CLTL_RABBITMQ_MGMT_BIND:-0.0.0.0}:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=eliza
      - RABBITMQ_DEFAULT_PASS=eliza123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - ../../storage/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cltl-platform

networks:
  cltl-platform:
    # Named after the Compose project so two deployments on one machine get
    # separate networks by setting CLTL_PROJECT alone. The default,
    # cltl-platform, is the name custom-module/ joins as an external network.
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
