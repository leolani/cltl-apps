# Mounted over servers/broker's rabbitmq service as its ONLY rabbitmq.conf
# (that service mounts none of its own) when servers/reverse-proxy is part of
# the bring-up invocation — see ./docker-compose.yml. Served through caddy
# under /rabbitmq/; without this setting the page loads and every asset
# resolves to the host root and 404s.
management.path_prefix = /rabbitmq
