# Mounted over modules/event-bus's rabbitmq service as its ONLY rabbitmq.conf
# (that service mounts none of its own) when modules/reverse-proxy is part of
# the bring-up invocation — see ./docker-compose.yml.

# Served through caddy under /rabbitmq/; without this setting the page loads
# and every asset resolves to the host root and 404s.
management.path_prefix = /rabbitmq

# AMQPS for tenants. The plain listener on 5672 stays, for this server's own
# modules on the Docker network; CLTL_AMQP_BIND=127.0.0.1 keeps it off the
# public interface.
#
# The files are caddy's certificate for CLTL_HOSTNAME, copied out of its data
# volume by scripts/sync-rabbitmq-cert.sh: cert.pem is the leaf, chain.pem the
# intermediates (Erlang's ssl reads only the first certificate of certfile and
# sends the rest of the chain from cacertfile). RabbitMQ refuses to start
# without them, so the script also seeds a self-signed pair on first use.
listeners.ssl.default = 5671
ssl_options.certfile = /etc/rabbitmq/tls/cert.pem
ssl_options.keyfile = /etc/rabbitmq/tls/key.pem
ssl_options.cacertfile = /etc/rabbitmq/tls/chain.pem
# Tenants authenticate with a password, not a client certificate.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
