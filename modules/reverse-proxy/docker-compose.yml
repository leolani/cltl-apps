# Optional TLS-termination and authentication for a deployment reachable from
# the public internet. Every other module is bare HTTP/AMQP with no auth —
# correct for a co-located demo, wrong for a host anyone outside this machine
# can reach. Add it to the bring-up command (see ../../doc/DEPLOYMENT.md)
# when, and only when, this deployment is public:
#
#   docker compose --env-file config/server.env \
#       -f modules/event-bus/docker-compose.yml \
#       -f modules/backend/docker-compose.yml \
#       -f modules/eliza/docker-compose.yml \
#       -f modules/vad-asr/docker-compose.yml \
#       -f modules/emissor/docker-compose.yml \
#       -f modules/reverse-proxy/docker-compose.yml up -d --wait --pull always
#
# Everything HTTP reachable from outside this host goes through caddy on 443,
# dispatched by URL path to the service it fronts — see ./Caddyfile.
#
# AMQP cannot go through caddy (its auth is in-protocol SASL, and stock caddy
# cannot proxy raw TCP), so RabbitMQ terminates TLS itself: this file adds an
# AMQPS listener on 5671, serving caddy's own certificate for CLTL_HOSTNAME.
# scripts/sync-rabbitmq-cert.sh copies that certificate into
# storage/rabbitmq-tls/ (and seeds a self-signed one before caddy has any);
# RabbitMQ will not start until that directory holds cert.pem, chain.pem and
# key.pem. scripts/install-server.sh does all of this, and runs the sync daily.
#
# One service here (`rabbitmq`) is not new — it is a partial override of the
# same service modules/event-bus/docker-compose.yml already defines. Compose
# concatenates list fields (like `ports` and `volumes`) across merged -f files
# for a service of the same name, so this file only ever adds to it; it
# changes nothing when this file is left out of the invocation.

name: ${CLTL_PROJECT:-cltl-platform}

services:
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 80 carries the ACME HTTP-01 challenge only. The redirect from 80 to
      # 443 is switched off in ./Caddyfile: every request here can carry a
      # Basic Auth credential, and an http:// URL mistyped by a client would
      # otherwise be redirected to https:// with a 308 (which preserves the
      # method and succeeds) — leaking that credential in clear text on the
      # way. With the redirect off, caddy has no server on 80 at all: it
      # listens there only for the length of an HTTP-01 challenge, so the
      # same mistake gets a connection reset.
      # The publish still has to stay, and so does the firewall rule.
      - "80:80"
      - "443:443"
    volumes:
      # Not ./Caddyfile: Compose resolves every relative bind-mount path in a
      # multi -f merge against the FIRST file's directory, not each file's
      # own — a real gotcha the other modules never hit only because every
      # modules/*/docker-compose.yml happens to sit at the same depth, so
      # their "../../" always lands on the repo root regardless of -f order.
      # This file's own content isn't at that depth from itself, so it needs
      # the explicit repo-root-relative form too.
      - ../../modules/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # One bcrypt line, `<user> <hash>`, shared by every handle block in the
      # Caddyfile. Generate it once per deployment:
      #   docker run --rm caddy:2.8-alpine caddy hash-password --plaintext '<password>'
      #   echo '<user> <hash>' > config/basic-auth.auth
      # A file, not inline in the Caddyfile: a bcrypt hash contains literal
      # `$` characters that collide with the Caddyfile's own `{$VAR}`
      # substitution syntax if written there directly.
      - ../../config/basic-auth.auth:/etc/caddy/secrets/basic_auth.auth:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CLTL_HOSTNAME: ${CLTL_HOSTNAME:?set CLTL_HOSTNAME in this checkout's env file, e.g. combot.example.org}
      CLTL_ACME_EMAIL: ${CLTL_ACME_EMAIL:?set CLTL_ACME_EMAIL in this checkout's env file}
      # The ACME directory. Let's Encrypt production unless set; point it at
      # https://acme-staging-v02.api.letsencrypt.org/directory while
      # experimenting, to stay clear of the production rate limits.
      CLTL_ACME_CA: ${CLTL_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    networks:
      - cltl-platform

  rabbitmq:
    ports:
      # AMQPS, for tenants. Plain 5672 is modules/event-bus's own binding;
      # set CLTL_AMQP_BIND=127.0.0.1 so this is the only way in from outside.
      - "5671:5671"
    volumes:
      # management.path_prefix = /rabbitmq (without it the management UI's
      # own page loads under a proxied path but every asset it links resolves
      # to the host root and 404s), plus the AMQPS listener.
      # modules/event-bus/docker-compose.yml mounts no rabbitmq.conf of its
      # own, so this is the only one RabbitMQ reads.
      - ../../modules/reverse-proxy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../../storage/rabbitmq-tls:/etc/rabbitmq/tls:ro

volumes:
  caddy-data:
  caddy-config:

networks:
  cltl-platform:
    name: ${CLTL_PROJECT:-cltl-platform}
    driver: bridge
