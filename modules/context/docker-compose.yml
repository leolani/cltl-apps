# One tenant's scenario-creation service: opens/closes the conversation
# scenario that makes clients/chat-ui willing to render and publish anything.
#
# Needs clients/backend for the SAME tenant up and healthy (see depends_on
# below — bring both files up in one invocation, or already-running).
#
#   docker compose --env-file ../../config/clients.env \
#       -f ../backend/docker-compose.yml -f docker-compose.yml up -d --wait --pull always

name: cltl-platform-client-${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}

services:
  context:
    image: ghcr.io/leolani/cltl-context:${VERSION:-latest}
    restart: "no"
    volumes:
      - ../../config/default.config:/cltl-context/config/default.config:ro
      - ../../config/custom.config:/cltl-context/config/custom.config:ro
      - ../../config/logging.config:/cltl-context/config/logging.config:ro
      - ../../storage:/cltl-context/storage
    environment:
      - CLTL_TENANT=${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}
      - CLTL_SERVER_HOST=${CLTL_SERVER_HOST:-host.docker.internal}
      - CLTL_LOGGING_CONFIG=/cltl-context/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
