# One tenant's web chat UI.
#
# Needs clients/backend for the SAME tenant up and healthy (see depends_on
# below — bring both files up in one invocation, or already-running).
#
#   docker compose --env-file ../../config/clients.env \
#       -f ../backend/docker-compose.yml -f docker-compose.yml up -d --wait --pull always

name: cltl-platform-client-${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}

services:
  chatui:
    image: ghcr.io/leolani/cltl-chat-ui:${VERSION:-latest}
    restart: "no"
    ports:
      - "${CLTL_CHATUI_PORT:?set a distinct host port per tenant, e.g. 8003 for tenant-a and 8004 for tenant-b}:8000"
    volumes:
      - ../../config/default.config:/cltl-chatui/config/default.config:ro
      - ../../config/custom.config:/cltl-chatui/config/custom.config:ro
      - ../../config/logging.config:/cltl-chatui/config/logging.config:ro
      - ../../storage:/cltl-chatui/storage
    environment:
      - CLTL_TENANT=${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}
      - CLTL_SERVER_HOST=${CLTL_SERVER_HOST:-host.docker.internal}
      - CLTL_LOGGING_CONFIG=/cltl-chatui/config/logging.config
      # Set via CLTL_MONITORING_URL in ../../config/clients.env (commented
      # out there by default, which leaves this tab out).
      - CLTL_MONITORING_URL=${CLTL_MONITORING_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
