# One tenant's scenario-creation service: opens/closes the conversation
# scenario that makes clients/chat-ui willing to render and publish anything.
#
# Needs servers/broker running first, and clients/backend for the SAME
# tenant up and healthy (see depends_on below — bring both files up in one
# invocation, or already-running). Do NOT also list
# servers/broker/docker-compose.yml here: this stack's project name differs
# from broker's, so Compose would try to re-create the already-running
# rabbitmq container and fail with a container-name conflict — and neither
# service below depends_on rabbitmq directly, only on clients/backend.
#
#   CLTL_TENANT=tenant-a \
#       docker compose -f ../backend/docker-compose.yml -f docker-compose.yml up -d --wait

name: cltl-platform-client-${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}

services:
  context:
    image: ghcr.io/leolani/cltl-context:${VERSION:-latest}
    restart: "no"
    volumes:
      - ../../config/default.config:/cltl-context/config/default.config:ro
      - ./config/custom.config:/cltl-context/config/custom.config:ro
      - ../../config/logging.config:/cltl-context/config/logging.config:ro
      - ../../storage:/cltl-context/storage
    environment:
      - CLTL_TENANT=${CLTL_TENANT:?set CLTL_TENANT to this client's tenant id, e.g. tenant-a}
      - CLTL_LOGGING_CONFIG=/cltl-context/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cltl-platform

networks:
  cltl-platform:
    name: cltl-platform
    external: true
