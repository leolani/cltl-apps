# Broker configuration for a permanently running, publicly reachable course
# server. The demo in custom-module needs none of this: it runs on a laptop for
# an afternoon, reachable only from that laptop.

# ---------------------------------------------------------------------------
# Listeners
#
# 5671 is AMQPS and is the only broker port with a public binding (see
# server.compose.yml). 5672 stays plaintext for loopback use — rabbitmqctl,
# and an operator debugging over SSH.
# ---------------------------------------------------------------------------
listeners.tcp.default = 5672
listeners.ssl.default = 5671

# The certificate caddy obtained, copied into place by bin/sync-certs.sh with
# ownership the broker can read. Caddy's own /data is deliberately NOT mounted
# here: its key is written root-only, and the broker does not run as root.
#
# RabbitMQ caches PEM files, so a renewal needs
#   rabbitmqctl eval 'ssl:clear_pem_cache().'
# which bin/sync-certs.sh runs for you. A restart also works and drops every
# student's connection; kombu reconnects, but a scenario opened from a notebook
# survives only because nothing expires it.
ssl_options.certfile = /etc/rabbitmq/tls/fullchain.pem
ssl_options.keyfile  = /etc/rabbitmq/tls/privkey.pem
# Server-authenticated TLS only: students prove who they are with a password,
# not a client certificate.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# ---------------------------------------------------------------------------
# Heartbeats
#
# A hint, not a guarantee. In AMQP 0-9-1 the client's TuneOk value is what is
# used, so a client that asks for 0 gets no heartbeats whatever this says —
# which is why the URL on every student's connection sheet carries
# `?heartbeat=30` as well. Without one, a laptop that closes its lid keeps its
# exclusive queue bound until TCP gives up.
# ---------------------------------------------------------------------------
heartbeat = 30

# ---------------------------------------------------------------------------
# Resource alarms
#
# The disk one matters more than it looks. Uploaded images land on the same
# filesystem as the broker, nothing in cltl-backend ever deletes them, and when
# this limit is crossed RabbitMQ BLOCKS PUBLISHERS — for every student at once,
# with no error that points at a full disk. bin/prune-images.sh is the other
# half of this; keep both.
# ---------------------------------------------------------------------------
disk_free_limit.absolute = 5GB
vm_memory_high_watermark.relative = 0.6

# ---------------------------------------------------------------------------
# Management UI
#
# Served through caddy under /rabbitmq/ with the instructor's credentials. The
# prefix has to be declared here as well: without it the page loads and every
# asset resolves to the host root and 404s.
# ---------------------------------------------------------------------------
management.path_prefix = /rabbitmq

# ---------------------------------------------------------------------------
# Logging
#
# The connection log IS the audit trail this deployment's trust model rests on:
# students may read and publish across tenants, and what stands between that
# and an unanswerable question is knowing which RabbitMQ user did it. Keep the
# files long enough to cover the term.
# ---------------------------------------------------------------------------
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.count = 90
